<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pomodoro Timer</title>
<link rel="stylesheet" href="styles.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<main class="card">
  <header>
    <h1>Pomodoro</h1>
    <p id="status">Pick a mode and start the clock.</p>
  </header>

  <div class="modes" id="modes">
    <button class="mode is-active" data-mode="focus" type="button">Focus</button>
    <button class="mode" data-mode="short" type="button">Short break</button>
    <button class="mode" data-mode="long" type="button">Long break</button>
  </div>

  <div class="dial" id="dial" style="--p: 100">
    <div class="dial-inner">
      <span class="time" id="time">25:00</span>
      <span class="mode-label" id="modeLabel">Focus session</span>
    </div>
  </div>

  <div class="dots" id="dots" aria-label="Completed focus sessions">
    <span></span><span></span><span></span><span></span>
  </div>

  <div class="actions">
    <button class="btn primary" id="startBtn" type="button">Start</button>
    <button class="btn" id="resetBtn" type="button">Reset</button>
    <button class="btn" id="skipBtn" type="button">Skip</button>
  </div>
</main>
<script src="script.js"></script>
</body>
</html>
